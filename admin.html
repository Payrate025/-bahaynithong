<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuya Thong — Admin Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap');

  :root {
    --forest: #1a3a2a;
    --gold:   #c9a84c;
    --cream:  #f5f0e8;
    --dark:   #0d1f16;
    --card:   #1e3d2c;
    --border: rgba(201,168,76,0.2);
    --red:    #e74c3c;
    --green:  #2ecc71;
    --blue:   #3498db;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    color: var(--cream);
    min-height: 100vh;
  }

  /* ── LOGIN SCREEN ── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a3a2a 0%, #0d1f16 70%);
  }
  .login-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 360px;
    text-align: center;
  }
  .login-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .login-sub { font-size: 13px; opacity: 0.5; margin-bottom: 32px; }
  .login-box input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--cream);
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  .login-box input:focus { border-color: var(--gold); }
  .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .login-btn:hover { background: #e0b85a; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }

  .topbar {
    background: var(--forest);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-brand {
    font-family: 'DM Serif Display', serif;
    color: var(--gold);
    font-size: 20px;
  }
  .topbar-brand span { font-family: 'DM Sans', sans-serif; font-size: 12px; opacity: 0.5; margin-left: 8px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-time { font-size: 13px; opacity: 0.5; }
  .logout-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover { background: var(--red); border-color: var(--red); }

  .main { padding: 32px; max-width: 1200px; margin: 0 auto; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 20px;
    border: none; background: none;
    color: var(--cream); opacity: 0.5;
    font-size: 14px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.2s;
  }
  .tab.active { opacity: 1; border-bottom-color: var(--gold); color: var(--gold); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── STAT CARDS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
  }
  .stat-label { font-size: 12px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-size: 36px; font-weight: 700; color: var(--gold); line-height: 1; }
  .stat-sub { font-size: 12px; opacity: 0.4; margin-top: 6px; }

  /* ── TABLE ── */
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: var(--gold); }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: rgba(201,168,76,0.1);
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--gold);
  }
  td { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-pending  { background: rgba(241,196,15,0.15); color: #f1c40f; }
  .badge-confirmed{ background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-cancelled{ background: rgba(231,76,60,0.15);  color: var(--red); }

  .action-btn {
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: none;
    color: var(--cream);
    font-size: 12px;
    cursor: pointer;
    margin-right: 4px;
    transition: all 0.2s;
  }
  .action-btn.confirm { border-color: var(--green); color: var(--green); }
  .action-btn.confirm:hover { background: var(--green); color: var(--dark); }
  .action-btn.cancel  { border-color: var(--red); color: var(--red); }
  .action-btn.cancel:hover  { background: var(--red); color: #fff; }

  /* ── CHAT LOGS ── */
  .chat-log-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .chat-log-meta { font-size: 11px; opacity: 0.45; margin-bottom: 8px; }
  .chat-log-user { font-size: 13px; margin-bottom: 4px; }
  .chat-log-user strong { color: var(--gold); }
  .chat-log-bot { font-size: 13px; opacity: 0.7; }
  .empty-state { text-align: center; padding: 60px 20px; opacity: 0.35; font-size: 14px; }

  /* ── CLEAR BTN ── */
  .clear-btn {
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.3);
    color: var(--red);
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    float: right;
    margin-bottom: 14px;
    transition: all 0.2s;
  }
  .clear-btn:hover { background: var(--red); color: #fff; }

  /* ── REFRESH ── */
  .refresh-btn {
    background: rgba(201,168,76,0.1);
    border: 1px solid var(--border);
    color: var(--gold);
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 14px;
    transition: all 0.2s;
  }
  .refresh-btn:hover { background: var(--gold); color: var(--dark); }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Bahay ni Thong</div>
    <div class="login-sub">Admin Intelligence Dashboard</div>
    <input type="text"     id="adminUser" placeholder="Username" />
    <input type="password" id="adminPass" placeholder="Password" />
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="loginError">Invalid credentials. Please try again.</div>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">Bahay ni Thong <span>Admin Dashboard</span></div>
    <div class="topbar-right">
      <div class="topbar-time" id="liveTime"></div>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="main">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('overview')">📊 Overview</button>
      <button class="tab" onclick="switchTab('bookings')">📅 Booking Requests</button>
      <button class="tab" onclick="switchTab('chatlogs')">💬 Chat Logs</button>
    </div>

    <!-- OVERVIEW -->
    <div id="tab-overview" class="tab-panel active">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="section-title">Recent Booking Requests</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Guests</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="overviewTable"></tbody>
        </table>
      </div>
    </div>

    <!-- BOOKINGS -->
    <div id="tab-bookings" class="tab-panel">
      <button class="refresh-btn" onclick="renderBookings()">↻ Refresh</button>
      <button class="clear-btn" onclick="clearBookings()">🗑 Clear All</button>
      <div style="clear:both"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Guest</th><th>Contact</th><th>Room</th><th>Dates</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookingsTable"></tbody>
        </table>
      </div>
    </div>

    <!-- CHAT LOGS -->
    <div id="tab-chatlogs" class="tab-panel">
      <button class="refresh-btn" onclick="renderLogs()">↻ Refresh</button>
      <button class="clear-btn" onclick="clearLogs()">🗑 Clear Logs</button>
      <div style="clear:both"></div>
      <div id="chatLogsContainer"></div>
    </div>
  </div>
</div>

<script>
// ── AUTH ────────────────────────────────────────────────
const SERVER     = "https://bahaynithong-production.up.railway.app";
const ADMIN_USER = "admin";
const ADMIN_PASS = "bahayniThong2025"; // Change this!

function doLogin() {
  const u = document.getElementById("adminUser").value.trim();
  const p = document.getElementById("adminPass").value;
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    initDashboard();
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}

document.getElementById("adminPass").addEventListener("keypress", e => {
  if (e.key === "Enter") doLogin();
});

function doLogout() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("adminUser").value = "";
  document.getElementById("adminPass").value = "";
}

// ── TABS ────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  event.target.classList.add("active");
  if (name === "bookings") renderBookings();
  if (name === "chatlogs") renderLogs();
}

// ── INIT ────────────────────────────────────────────────
function initDashboard() {
  renderStats();
  renderOverview();
  renderBookings();
  startClock();
  setInterval(renderStats, 10000);
}

function startClock() {
  function tick() {
    document.getElementById("liveTime").textContent =
      new Date().toLocaleString("en-PH", { dateStyle: "medium", timeStyle: "short" });
  }
  tick();
  setInterval(tick, 1000);
}

// ── DATA ────────────────────────────────────────────────
async function fetchBookings() {
  try {
    const res = await fetch(SERVER + "/bookings");
    const data = await res.json();
    localStorage.setItem("bookingRequests", JSON.stringify(data));
    return data;
  } catch(e) {
    return JSON.parse(localStorage.getItem("bookingRequests") || "[]");
  }
}
function getBookings() { return JSON.parse(localStorage.getItem("bookingRequests") || "[]"); }
function getLogs()      { return JSON.parse(localStorage.getItem("chatLogs") || "[]"); }
function saveBookings(d){ localStorage.setItem("bookingRequests", JSON.stringify(d)); }

// ── STATS ───────────────────────────────────────────────
function renderStats() {
  const bookings = getBookings();
  const logs     = getLogs();
  const pending  = bookings.filter(b => b.status === "Pending").length;
  const confirmed= bookings.filter(b => b.status === "Confirmed").length;

  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total Conversations</div>
      <div class="stat-value">${logs.length}</div>
      <div class="stat-sub">via Kuya Thong chatbot</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Booking Requests</div>
      <div class="stat-value">${bookings.length}</div>
      <div class="stat-sub">${pending} pending · ${confirmed} confirmed</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending Action</div>
      <div class="stat-value" style="color:${pending>0?'#f1c40f':'#2ecc71'}">${pending}</div>
      <div class="stat-sub">requests awaiting response</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last Activity</div>
      <div class="stat-value" style="font-size:18px;padding-top:8px">
        ${logs.length ? new Date(logs[logs.length-1].ts).toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"}) : "—"}
      </div>
      <div class="stat-sub">${logs.length ? new Date(logs[logs.length-1].ts).toLocaleDateString("en-PH") : "No activity yet"}</div>
    </div>
  `;
}

// ── OVERVIEW TABLE ───────────────────────────────────────
function renderOverview() {
  const bookings = getBookings().slice(-5).reverse();
  const tbody = document.getElementById("overviewTable");
  if (!bookings.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;opacity:0.4;padding:40px">No booking requests yet.</td></tr>`;
    return;
  }
  tbody.innerHTML = bookings.map(b => `
    <tr>
      <td>${b.name}</td>
      <td>${b.room}</td>
      <td>${b.checkin}</td>
      <td>${b.checkout}</td>
      <td>${b.guests || "—"}</td>
      <td><span class="badge badge-${(b.status||'Pending').toLowerCase()}">${b.status || "Pending"}</span></td>
    </tr>
  `).join("");
}

// ── BOOKINGS TABLE ───────────────────────────────────────
function renderBookings() {
  const bookings = getBookings().reverse();
  const tbody = document.getElementById("bookingsTable");
  if (!bookings.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;opacity:0.4;padding:40px">No booking requests yet.</td></tr>`;
    return;
  }
  tbody.innerHTML = bookings.map((b, i) => `
    <tr>
      <td style="font-size:11px;opacity:0.5">${new Date(b.ts).toLocaleDateString("en-PH")}</td>
      <td>
        <strong>${b.name}</strong>
        ${b.email ? `<br><span style="font-size:11px;opacity:0.5">${b.email}</span>` : ""}
      </td>
      <td>${b.phone}</td>
      <td style="font-size:12px">${b.room}</td>
      <td style="font-size:12px">${b.checkin} → ${b.checkout}</td>
      <td><span class="badge badge-${(b.status||'Pending').toLowerCase()}">${b.status || "Pending"}</span></td>
      <td>
        <button class="action-btn confirm" onclick="updateStatus(${bookings.length-1-i}, 'Confirmed')">✓ Confirm</button>
        <button class="action-btn cancel"  onclick="updateStatus(${bookings.length-1-i}, 'Cancelled')">✗ Cancel</button>
      </td>
    </tr>
  `).join("");
}

function updateStatus(idx, status) {
  const data = getBookings();
  data[idx].status = status;
  saveBookings(data);
  renderBookings();
  renderStats();
}

function clearBookings() {
  if (confirm("Clear all booking requests?")) {
    localStorage.removeItem("bookingRequests");
    renderBookings();
    renderStats();
  }
}

// ── CHAT LOGS ────────────────────────────────────────────
function renderLogs() {
  const logs = getLogs().reverse();
  const container = document.getElementById("chatLogsContainer");
  if (!logs.length) {
    container.innerHTML = `<div class="empty-state">No chat logs yet. Conversations will appear here once guests interact with Kuya Thong.</div>`;
    return;
  }
  container.innerHTML = logs.map(l => `
    <div class="chat-log-item">
      <div class="chat-log-meta">${new Date(l.ts).toLocaleString("en-PH")} · Guest: ${l.guest}</div>
      <div class="chat-log-user"><strong>Guest:</strong> ${l.user}</div>
      <div class="chat-log-bot"><strong>Kuya Thong:</strong> ${l.bot}</div>
    </div>
  `).join("");
}

function clearLogs() {
  if (confirm("Clear all chat logs?")) {
    localStorage.removeItem("chatLogs");
    renderLogs();
    renderStats();
  }
}
</script>
</body>
</html>
